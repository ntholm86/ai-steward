# AI Steward V1 — self-targeting configuration
#
# This config is used when ai-steward runs against its own repository.
# Self-targeting is the V1 milestone (destination 2026-06-20).
#
# repo: comes from the CLI argument, not this file.

models:
  analyze: claude-sonnet-4-5   # SCAN reasoning — proposal quality determines acceptance rate
  propose: claude-sonnet-4-5   # same SCAN call
  implement: claude-sonnet-4-5 # code quality — better first-pass → fewer VERIFY failures
  verify: claude-haiku-4-5     # tier-0 in V1 — no LLM call fires here; keep cheap
  judge: claude-opus-4-5       # highest-stakes gate (sparingly used); worth paying for

harness:
  endpoint: "http://localhost:8474"

scope:
  # Only Python source files in scope — tests and trail are off-limits for V1.
  allowed:
    - "src/**/*.py"
  blocked:
    - "tests/**"
    - ".acm/**"

sandbox: local

max_iterations: 8          # hard cap on cycles per run-loop invocation; the loop also stops
                           # earlier on convergence (2 consecutive NOTHING FOUND), budget, or
                           # an ESCALATE trigger. With review_branch (default true) each
                           # proposal commits to a per-run review branch, so all 8 cycles can
                           # complete unattended; you review the batch diff afterwards.
budget_usd: 1.0            # cumulative LLM cost ceiling per run-loop, estimated from harness-
                           # measured token counts; loop stops when reached. ~$0.15-0.20/cycle
                           # on sonnet-4-5 (measured 2026-06-22), so $1.00 covers ~5-7 cycles.
max_tokens_scan: 4096      # max output tokens for the SCAN call (5-step reasoning + JSON
                           # proposal); 1024 truncated the response mid-JSON
max_tokens_implement: 4096 # max output tokens for the IMPLEMENT call, which rewrites whole
                           # files; must fit the largest in-scope file plus the change
allow_dirty: false         # require a clean git tree before the first cycle (PRE-FLIGHT gate).
                           # With review_branch on, later cycles stay clean because proposals
                           # commit to the review branch; set true only to run on a tree that
                           # already has uncommitted work.
